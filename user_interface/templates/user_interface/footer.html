    {% load static %}
    <footer class="footer">
        <div class="edit-view footer-button">
            <a href="{% url 'fill_form_update' pk=form_pk %}">
                <img src="{% static 'icons/list-option.png' %}">
                <span>Edit inspection form</span>
            </a>
        </div>
        <div class="start footer-button">
            <a href="" id="start">
                <img src="{% static 'icons/play.png' %}">
                <span>Start inspection</span>
            </a>
            <a href="" id="stop" hidden>
                <img src="{% static 'icons/stop.png' %}">
                <span>Stop inspection</span>
            </a>
            <a href="" id="repeat-inspection" hidden>
                <img src="{% static 'icons/refresh.png' %}">
                <span>Repeat measurement</span>
            </a>
        </div>
        <div class="report footer-button" id="report">
            <a href="">
                <img src="{% static 'icons/documents.png' %}">
                <span>Generate report</span>
            </a>
        </div>
    </footer>
