<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'user_interface/base.css' %}">
    <script src="{% static 'js/jquery-3.7.1.min.js' %}"></script>
    <script src="{% static 'js/base.js' %}"></script>
    {% block page_css %} {% endblock %}
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a href="{% url 'admin:index' %}">
            <img class="navbar-brand" src="{% static 'icons/Logo_ALTO.png' %}">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
          <div class="navbar-nav">
            <div class="nav-buttons nav-link active">
                <span>Main menu: </span>
                <a class="" aria-current="page" href="{% url 'home' %}">
                    <img src="{% static 'icons/building.png' %}">
                </a>
            </div>
            <div class="nav-buttons nav-link active">
                <span>SDK connection: </span>
                <a aria-current="page" href="{% url 'start_sdk' %}">
                    <img class="sdk-status" src="{% static 'icons/check.png' %}">
                </a>
            </div>
            <div class="nav-buttons nav-link active">
                <span>Device connection: </span>
                <a class="" aria-current="page" href="#">
                    <img class="instrument-connection" src="{% static 'icons/mark.png' %}">
                </a>
            </div>
            <div class="nav-buttons nav-link active">
                <span>Close app: </span>
                <a class="" aria-current="page" href="{% url 'exit' %}">
                    <img src="{% static 'icons/power.png' %}">
                </a>
            </div>
          </div>
        </div>
      </div>
    </nav>
{% block content %}
{% endblock %}
    <script src="{% static 'js/base.js' %}"></script>
    <script>
        $(function() {
            $.get(url="{% url 'api_sdk_test' %}", success=function(data) {
                var result = data;
                var img_selection = $("img.sdk-status")

                if (result === 'True') {
                    img_selection.attr("src", "{% static 'icons/check.png' %}");
                } else {
                    img_selection.attr("src", "{% static 'icons/mark.png' %}");
                }
            });

            $.get(url="{% url 'instrument_connection_test' %}", success=function(data) {
                var result = data;
                var img_selection = $("img.instrument-connection")

                if (result === 'True') {
                    img_selection.attr("src", "{% static 'icons/check.png' %}");
                } else {
                    img_selection.attr("src", "{% static 'icons/mark.png' %}");
                }
            });
        });


    </script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>

</body>
</html>
