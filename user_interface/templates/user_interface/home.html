{% extends "user_interface/base.html" %}
{% load static %}
{% block page_css %}
<link rel="stylesheet" href="{% static 'user_interface/home.css' %}">
{% endblock %}

{% block content %}
    <div class="container-fluid text-center">
      <div class="row row-cols-3 g-2">
        {% for function in object_list %}
        <div class="col">
          <div class="function">
              {% if function.view_name %}
              <a href="{% url 'fill_form' pk=function.pk %}">{{ function.name }}</a>
              {% else %}
              <a href="">{{ function.name }}</a>
              {% endif %}
          </div>
        </div>
        {% endfor %}
      </div>
    </div>
{% endblock %}
