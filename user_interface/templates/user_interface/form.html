{% extends "user_interface/base.html" %}
{% load static %}
{% block page_css %}
<link rel="stylesheet" href="{% static 'user_interface/form.css' %}">
{% endblock %}

{% block content %}
    <div class="container-flex text-center">
      <div class="row align-items-center">
        <div class="col" id="in-form">
            <form method="post" action="">{% csrf_token %}
                <h1>Inpection registration form</h1>
                <ul>
                {{ form.as_ul }}
                </ul>
                <button type="submit">
                    <img src="{% static 'icons/right.png' %}">
                    <span>Save and proceed</span>
                </button>
            </form>
        </div>
        <div class="col picture">
            <img src="{% static 'icons/registration.png' %}">
        </div>
      </div>
    </div>
{% endblock %}
